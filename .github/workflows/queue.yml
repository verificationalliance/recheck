# About every 5 minutes: reads the queue of signed results waiting for our re-check, which our server
# publishes, and calls recheck.yml once for each entry not re-checked yet. recheck.yml uploads its
# signed result as the artifact osva-recheck-<id>, which our server collects; an entry is done when
# a run of this workflow on main uploaded its artifact.
#
# GitHub's scheduler has never run this workflow's schedule, so each run ends by dispatching the
# next, 5 minutes after its work (job next). The schedule stays, should GitHub start running it. A
# run cancelled by hand dispatches nothing: start the chain again with one dispatch on main.
#
# A maintainer can also start it by hand, with queue-url naming a test queue in this repository.
#
# The queue is our server's, but its fields reach checkouts, artifact names and steps, so
# scripts/queue.py checks each against its pattern first, and drops an entry that fails with a fixed
# reason. Nothing of an entry is printed.
name: queue

on:
  # Every 5 minutes, off the hour: GitHub delays scheduled runs at the start of every hour, and may
  # drop some. A schedule runs on the latest commit of main; a workflow whose schedule GitHub turned
  # off runs it again after a commit that changes this cron line.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      queue-url:
        description: "Maintainers only: a test queue, https://raw.githubusercontent.com/verificationalliance/recheck/<ref>/<path>"
        type: string
        required: false
        default: ""

# One run at a time, and none cancelled: an entry being re-checked is never re-checked twice at once.
concurrency:
  group: recheck
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  plan:
    name: plan
    if: github.repository == 'verificationalliance/recheck'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the queue
        id: plan
        env:
          QUEUE_URL: ${{ inputs.queue-url }}
          DEFAULT_URL: https://verificationalliance.org/data/recheck-pending.json
          GH_TOKEN: ${{ github.token }}
        run: |
          url=${QUEUE_URL:-$DEFAULT_URL}
          test='^https://raw\.githubusercontent\.com/verificationalliance/recheck/[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+$'
          if [[ $url != "$DEFAULT_URL" ]] && ! [[ $url =~ $test && $url != *..* ]]; then
            echo "::error::queue-url must name a file of verificationalliance/recheck on raw.githubusercontent.com."
            exit 1
          fi
          dir="$RUNNER_TEMP/plan"
          mkdir "$dir"
          curl -fsS --proto '=https' --tlsv1.2 --retry 3 --max-time 60 --max-filesize 1000000 \
            -o "$dir/queue.json" "$url"
          # The workflow releases: a signer_sha must be the commit of one.
          git ls-remote --tags https://github.com/verificationalliance/verify 'refs/tags/workflow-*' > "$dir/releases"
          python3 -I scripts/queue.py entries "$dir/queue.json" "$dir/releases" > "$dir/entries.json"
          # The re-checks done and the checks stopped: each entry's artifacts osva-recheck-<id> and
          # osva-recheck-stopped-<id>, every page of each list (others' artifacts by those names can
          # come first; queue.py says when to stop), and the runs that uploaded one. queue.py counts
          # only a run of queue.yml on this repository's main.
          while read -r id; do
            for kind in artifacts stops; do
              if [[ $kind == stops ]]; then name=osva-recheck-stopped-$id; else name=osva-recheck-$id; fi
              page=1
              while true; do
                gh api "repos/verificationalliance/recheck/actions/artifacts?name=$name&per_page=100&page=$page" \
                  > "$dir/$kind-$id-$page.json"
                python3 -I scripts/queue.py more "$dir" "$id" "$page" "$kind" || break
                page=$((page + 1))
              done
            done
          done < <(python3 -I scripts/queue.py ids "$dir/entries.json")
          while read -r run; do
            gh api "repos/verificationalliance/recheck/actions/runs/$run" > "$dir/run-$run.json"
          done < <(python3 -I scripts/queue.py runs "$dir")
          python3 -I scripts/queue.py plan "$dir" >> "$GITHUB_OUTPUT"

  # The job's permissions are what recheck.yml's jobs may have at most: its check job takes
  # contents and actions read only, its sign job id-token and attestations write.
  recheck:
    name: recheck ${{ matrix.entry.id }}
    needs: plan
    if: github.repository == 'verificationalliance/recheck' && needs.plan.outputs.matrix != '[]'
    strategy:
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: 2
      fail-fast: false
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/recheck.yml
    with:
      id: ${{ matrix.entry.id }}
      repo: ${{ matrix.entry.repo }}
      commit: ${{ matrix.entry.commit }}
      run-id: ${{ matrix.entry.run_id }}
      artifact-id: ${{ matrix.entry.artifact_id }}
      signer-sha: ${{ matrix.entry.signer_sha }}
      manifest: ${{ matrix.entry.manifest }}

  # The chain: 5 minutes after the work above, whatever became of it (but not after a cancel), the
  # next run of this workflow on main, with no inputs, so a test queue is never carried on. The
  # concurrency group keeps one run going and one waiting, and a newer waiting run replaces the
  # older before it starts, so two chains never run side by side; and when another run already
  # waits or runs (one started by hand, or by GitHub's schedule), it is the next one, and this run
  # dispatches nothing, rather than replace it. If that count cannot be read, it dispatches anyway.
  next:
    name: next
    needs: [plan, recheck]
    if: github.repository == 'verificationalliance/recheck' && github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 300
          others=$(gh api 'repos/verificationalliance/recheck/actions/workflows/queue.yml/runs?per_page=30' \
            --jq '[.workflow_runs[] | select(.id != ($ENV.GITHUB_RUN_ID | tonumber) and .status != "completed")] | length') || others=unknown
          if [[ $others =~ ^[1-9][0-9]*$ ]]; then
            echo "Another run of queue.yml waits or runs: it is the next one."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api -X POST repos/verificationalliance/recheck/actions/workflows/queue.yml/dispatches -f ref=main; then
              echo "Dispatched the next run of queue.yml on main."
              exit 0
            fi
            sleep 30
          done
          echo "::error::The next run of queue.yml could not be dispatched: the chain stops here."
          exit 1
