# Throwaway: finds out whether this workflow's own GITHUB_TOKEN can download an
# artifact from another public repository's run. Deleted once recheck.yml exists.
name: probe

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/name of the repository whose run made the artifact"
        required: true
        type: string
      run-id:
        description: "id of that workflow run"
        required: true
        type: string

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download osva-proof-result from the other repository's run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osva-proof-result
          repository: ${{ inputs.repository }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/probe

      # Prints only a size and a hash: no text from the artifact reaches the log.
      - name: Check that result.json arrived
        env:
          DIR: ${{ runner.temp }}/probe
        run: |
          test -f "$DIR/result.json"
          echo "result.json downloaded: $(wc -c < "$DIR/result.json") bytes"
          sha256sum < "$DIR/result.json" | cut -d' ' -f1
